services:
  api:
    build: ./server
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      CLEANUP_INTERVAL_HOURS: 6   # 0 desativa a limpeza automática de mapas não usados
      UPLOAD_GRACE_MINUTES: 60    # tolerância antes de apagar um upload órfão
    volumes:
      - mesa-data:/data   # salas, tokens, névoa e mapas enviados

  web:
    build: ./client
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      - api

volumes:
  mesa-data:
